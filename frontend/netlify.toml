# netlify.toml — Netlify deployment config for the CellSight React frontend
#
# Setup:
#   1. Connect your GitHub repo to Netlify.
#   2. Set the environment variable VITE_API_URL to your Railway backend URL:
#      e.g. https://cellsight-api.up.railway.app
#   3. Netlify will build and deploy automatically on every push to main.

[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# SPA routing — send all paths to index.html so React Router handles them
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers for the frontend
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively, HTML never
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
