# Dependency Review Configuration
# See: https://github.com/actions/dependency-review-action

# Fail on vulnerable dependencies with severity >= high
fail-on-severity: high

# Allow specific vulnerabilities with justification (use sparingly)
# allowlist:
#   - GHSA-xxxx-xxxx-xxxx: "Mitigated by X, tracked in issue #123"

# Block licenses that are not compatible with MIT
# license-check: true
# allowed-licenses:
#   - MIT
#   - Apache-2.0
#   - BSD-2-Clause
#   - BSD-3-Clause
#   - ISC
#   - CC0-1.0
