name: Secret Scan — Full History Audit

# Manually triggered only.
# Run this before security reviews, after adding the gitleaks check,
# and any time a secret may have been committed in older history.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-scan:
    name: Gitleaks full history scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks against full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LOG_OPTS means gitleaks scans all commits.
