name: Keep Backend Alive

# Ping Railway every 5 minutes to prevent cold starts.
# This job is designed to NEVER fail — no email notifications.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Railway backend
    runs-on: ubuntu-latest
    # Prevent GitHub from sending failure emails for this housekeeping job
    continue-on-error: true
    steps:
      - name: Ping health endpoint
        # Use || true so curl timeouts/failures never fail the step
        run: |
          curl -s -o /dev/null -w "Health check: %{http_code}\n" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "https://cellsight-api-production.up.railway.app/api/health" || true
