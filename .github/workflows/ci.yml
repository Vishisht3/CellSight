name: CI / CD

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Backend: typecheck + lint ─────────────────────────────────────────
  backend-ci:
    name: Backend — typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ── 2. Frontend: typecheck + lint + build ────────────────────────────────
  frontend-ci:
    name: Frontend — typecheck, lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          # Use a placeholder for CI — actual value is set in Netlify dashboard
          VITE_API_URL: https://cellsight-api.onrender.com
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── 3. Deploy backend to Render ──────────────────────────────────────────
  # Only runs on pushes to main after both CI jobs pass.
  # Render's GitHub integration handles auto-deploy via render.yaml, so this
  # job is a lightweight hook that confirms the deploy succeeded and surfaces
  # any failure in the GitHub UI.
  deploy-backend:
    name: Deploy Backend → Render
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        # Uses the Render Deploy Hook URL stored as a GitHub secret.
        # To set this up:
        #   1. Render dashboard → cellsight-api → Settings → Deploy Hooks → Create
        #   2. Copy the hook URL
        #   3. GitHub repo → Settings → Secrets → Actions → New secret
        #      Name: RENDER_DEPLOY_HOOK_URL
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL not set — skipping Render trigger"
            exit 0
          fi
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered"

      - name: Wait for Render health check
        run: |
          echo "Waiting 60s for Render to spin up…"
          sleep 60
          HEALTH_URL="https://cellsight-api.onrender.com/api/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL")
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
            echo "Backend is reachable (HTTP $STATUS)"
          else
            echo "::error::Backend health check failed (HTTP $STATUS)"
            exit 1
          fi

  # ── 4. Deploy frontend to Netlify ────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Netlify
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for production
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Netlify
        # Uses the official Netlify Action.
        # Required GitHub secrets:
        #   NETLIFY_AUTH_TOKEN — from Netlify User Settings → Personal Access Tokens
        #   NETLIFY_SITE_ID    — from Netlify Site → Settings → General → Site ID
        #   VITE_API_URL       — your Render backend URL, e.g. https://cellsight-api.onrender.com
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: frontend/dist
          production-branch: main
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
          fails-without-credentials: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
