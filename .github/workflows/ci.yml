name: CI / CD

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default GITHUB_TOKEN permissions to least privilege
permissions:
  contents: read
  deployments: write

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Backend: typecheck + lint ─────────────────────────────────────────
  backend-ci:
    name: Backend — typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ── 2. Frontend: typecheck + lint + build ────────────────────────────────
  frontend-ci:
    name: Frontend — typecheck, lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          # Placeholder for CI — actual value injected by Vercel at deploy time
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://cellsight-api-production.up.railway.app' }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── 3. Verify backend health on Railway ──────────────────────────────────
  # Only runs on pushes to main after both CI jobs pass.
  # Railway auto-deploys on push — this job waits and confirms healthy.
  deploy-backend:
    name: Deploy Backend → Railway
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Railway health check
        env:
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
        run: |
          if [ -z "$BACKEND_HEALTHCHECK_URL" ]; then
            echo "::warning::BACKEND_HEALTHCHECK_URL not set — skipping backend health check"
            exit 0
          fi
          echo "Waiting 60s for Railway deploy to spin up…"
          sleep 60
          HEALTHCHECK_URL="$BACKEND_HEALTHCHECK_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL")
          if [ "$STATUS" = "404" ]; then
            FALLBACK_URL="${BACKEND_HEALTHCHECK_URL%/}/api/health"
            if [ "$FALLBACK_URL" != "$HEALTHCHECK_URL" ]; then
              echo "Primary health check returned 404, retrying with $FALLBACK_URL"
              HEALTHCHECK_URL="$FALLBACK_URL"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL")
            fi
          fi
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
            echo "Backend is reachable (HTTP $STATUS) at $HEALTHCHECK_URL"
          else
            echo "::error::Backend health check failed at $HEALTHCHECK_URL (HTTP $STATUS)"
            exit 1
          fi

  # ── 4. Deploy frontend to Vercel ─────────────────────────────────────────
  # Only runs on pushes to main after both CI jobs pass.
  #
  # Required GitHub secrets:
  #   VERCEL_TOKEN   — Vercel → Account Settings → Tokens → Create
  #   VERCEL_ORG_ID  — run `vercel whoami --json` or find in .vercel/project.json
  #   VERCEL_PROJECT_ID — created when you first link the project (see setup below)
  #   VITE_API_URL   — your Railway backend URL (also set in Vercel dashboard)
  #
  # One-time setup (run locally once):
  #   npm i -g vercel
  #   cd frontend && vercel link   # follow prompts, creates .vercel/project.json
  #   # Copy org-id and project-id from .vercel/project.json into GitHub secrets
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        working-directory: frontend
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build for production
        working-directory: frontend
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
