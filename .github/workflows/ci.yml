name: CI / CD

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default GITHUB_TOKEN permissions to least privilege
permissions:
  contents: read
  deployments: write

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── 0. Secret scan — runs first, blocks all other jobs ───────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can walk commits.
          # On PRs we limit the range below; on pushes to main we scan HEAD~1..HEAD.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On PRs scan only the diff introduced by this PR.
          # On pushes to main scan only the latest commit.
          GITLEAKS_LOG_OPTS: >-
            ${{ github.event_name == 'pull_request'
                && format('origin/{0}..HEAD', github.base_ref)
                || 'HEAD~1..HEAD' }}

  # ── 1. Backend: typecheck + lint ─────────────────────────────────────────
  backend-ci:
    name: Backend — typecheck & lint
    runs-on: ubuntu-latest
    needs: [secret-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ── 2. Frontend: typecheck + lint + build ────────────────────────────────
  frontend-ci:
    name: Frontend — typecheck, lint & build
    runs-on: ubuntu-latest
    needs: [secret-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://cellsight-api-production.up.railway.app' }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── 3. Verify backend health on Railway ──────────────────────────────────
  deploy-backend:
    name: Deploy Backend — Railway
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Railway health check
        env:
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
        run: |
          if [ -z "$BACKEND_HEALTHCHECK_URL" ]; then
            echo "::warning::BACKEND_HEALTHCHECK_URL not set, skipping health check"
            exit 0
          fi
          echo "Waiting 60s for Railway deploy..."
          sleep 60
          HEALTHCHECK_URL="$BACKEND_HEALTHCHECK_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL")
          if [ "$STATUS" = "404" ]; then
            FALLBACK_URL="${BACKEND_HEALTHCHECK_URL%/}/api/health"
            if [ "$FALLBACK_URL" != "$HEALTHCHECK_URL" ]; then
              echo "404 at primary URL, retrying with $FALLBACK_URL"
              HEALTHCHECK_URL="$FALLBACK_URL"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL")
            fi
          fi
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
            echo "Backend reachable (HTTP $STATUS) at $HEALTHCHECK_URL"
          else
            echo "::error::Backend health check failed at $HEALTHCHECK_URL (HTTP $STATUS)"
            exit 1
          fi

  # ── 4. Deploy frontend to Vercel ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend — Vercel
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Vercel CLI
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --token "$VERCEL_TOKEN" --cwd frontend

# ── Full-history audit — manually triggered only ──────────────────────────────
# Run this periodically or before any new security review.
# It will not be triggered on every push or PR.
